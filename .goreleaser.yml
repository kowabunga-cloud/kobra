---
version: 2
project_name: ipsctl

builds:
- main: ./cmd/ipsctl/main.go
  binary: ipsctl
  flags:
    - -trimpath
    - -v
  gcflags:
    - ipsctl/...=-e
  ldflags:
    - -w -s -X {{.Env.PKG_NAME}}.version={{.Env.VERSION}}
  goos:
    - darwin
    - linux
  goarch:
    - amd64
    - arm64

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_SHA256SUMS"
